<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>蕭有邦 | 個人主頁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card">
    <button id="theme-btn" class="theme-toggle" title="切換日夜模式">☀️</button>

    <img src="avatar.jpg" alt="個人頭像" class="avatar">
    
    <h1>蕭有邦</h1>
    <!-- 修改：加入打字機文字容器與閃爍游標 -->
    <p class="title">
      <span id="typewriter"></span><span class="cursor">|</span>
    </p>
    <p class="bio">
      嗨！我正在用 VS Code 打造我的第一個網站。熱愛學習新技術，喜歡把腦中的想法變成真實的網頁作品。
    </p>

    <div class="links">
      <a href="https://github.com" target="_blank" class="btn">GitHub</a>
      <button id="like-btn" class="btn btn-outline">👋 打招呼 (<span id="like-count">0</span>)</button>
    </div>

    <!-- 修改：換成 SVG 品牌與功能小圖示 -->
    <div class="social-bar">
      <!-- Instagram SVG -->
      <a href="https://www.instagram.com/bryantxiao.0619?bqrl=cDVqbnZnbDBreDFw&utm_source=qr" target="_blank" class="social-icon" title="Instagram">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
          <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
          <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
        </svg>
      </a>
      <!-- Threads SVG -->
      <a href="https://www.threads.com/@bryantxiao.0619?igshid=NTc4MTIwNjQ2YQ==" target="_blank" class="social-icon" title="Threads">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12a7 7 0 1 0-7 7c3.5 0 6-2 6-5.5 0-2.5-1.5-4-3.5-4-1.8 0-3 1.2-3 3s1.2 3 2.8 3c1.2 0 2.2-.7 2.2-2V9"></path>
        </svg>
      </a>
      <!-- Email SVG -->
      <a href="mailto:dsa125879@gmail.com" class="social-icon" title="寄信給我">
        <svg viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
          <polyline points="22,6 12,13 2,6"></polyline>
        </svg>
      </a>
    </div>

    <section class="portfolio">
      <h2>精選作品與專案</h2>
      <div class="project-list">
        <a href="#" class="project-item">
          <div class="project-info">
            <h3>個人數位名片網頁</h3>
            <p>使用 HTML / CSS / JS 打造的響應式名片</p>
          </div>
          <span class="arrow">↗</span>
        </a>
      <a href="https://my-react-app-five-rho.vercel.app" target="_blank" class="project-item">
          <div class="project-info">
            <h3>🚀 React 開發任務追蹤板</h3>
            <p>使用 Vite + React 打造的互動式待辦儀表板</p>
          </div>
          <span class="arrow">↗</span>
        </a>
        <a href="https://weather-currency-app-nu.vercel.app" target="_blank" class="project-item">
          <div class="project-info">
            <h3>🌐 即時生活資訊儀表板</h3>
            <p>React + Tailwind CSS 雙公開 API 串接實戰</p>
          </div>
          <span class="arrow">↗</span>
        </a>
      </div>
    </section>
    <!-- 新增：真實雲端留言表單（把 action 換成你剛剛在 Formspree 複製的網址） -->
    <section class="contact-section">
      <h2>傳送訊息給我</h2>
      <form id="contact-form" action="https://formspree.io/f/xnpdwlyk" method="POST" class="contact-form">
        <input type="text" name="name" placeholder="你的名字" required>
        <input type="email" name="email" placeholder="你的 Email（方便我回覆你）" required>
        <textarea name="message" rows="3" placeholder="想對我說的話..." required></textarea>
        <button type="submit" class="btn submit-btn">送出留言 ✉️</button>
      </form>
      <p id="form-status" class="form-status"></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
